{% extends 'base.html' %}

{% block title %}Start Attendance{% endblock %}

{% block content %}
<section class="card" style="max-width: 700px; margin: 0 auto;">
    <h2 class="section-title">Start Attendance Session</h2>
    <p class="section-subtitle"><strong>{{ class.name }}</strong> ({{ class.code }})</p>
    <form method="post">
        {% csrf_token %}
        <label for="id_date">Session Date</label>
        <input type="date" id="id_date" name="date" value="{{ today|date:'Y-m-d' }}" required>
        <div class="actions">
            <button type="submit" class="btn">Create/Resume Session</button>
            <a href="{% url 'classes:detail' class.pk %}" class="btn btn-outline">Back</a>
        </div>
    </form>
</section>
{% endblock %}
