{% extends 'base.html' %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<section class="card" style="max-width: 760px; margin: 0 auto;">
    <h2 class="section-title">Edit Student</h2>
    <p class="section-subtitle">{{ class.name }} ({{ class.code }})</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit" class="btn">Update Student</button>
            <a href="{% url 'classes:detail' class.pk %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
